{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;margin:4rem auto;">
  <h1>Sign in</h1>
  <p>Private CRM access for Onboarda/RegMind.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Username<br><input name="username" required></label><br>
    <label>Password<br><input name="password" type="password" required></label><br>
    <button type="submit">Login</button>
  </form>
</div>
{% endblock %}
