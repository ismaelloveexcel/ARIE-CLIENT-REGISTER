{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>New Client/Company Record</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Company/Client Name<br><input name="name" required></label><br>
    <label>Type<br>
      <select name="kind">
        <option value="lead">Lead</option>
        <option value="client">Client</option>
      </select>
    </label><br>
    <label>Status<br><input name="status" value="lead"></label><br>
    <label>KYC stage<br><input name="kyc_stage" value="not_started"></label><br>
    <label>Document checklist status<br><input name="document_status" value="not_started"></label><br>
    <button type="submit">Create record</button>
  </form>
</div>
{% endblock %}
